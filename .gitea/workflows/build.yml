name: Flutter Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    env:
      CM_KEYSTORE_PATH: ${{ secrets.CM_KEYSTORE_PATH }}
      CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
      CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
      CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get dependencies
        run: flutter pub get

      # --wasm compiles with dart2wasm and also emits a dart2js bundle, which
      # flutter_bootstrap.js falls back to on browsers without WasmGC.
      # --pwa-strategy=none stops shipping a service worker, so deploys are
      # picked up on reload instead of being served from its cache.
      - name: Build Web (wasm, release)
        run: flutter build web --wasm --release --pwa-strategy=none

      - name: Deploy to /root/projects
        run: |
          REPO_NAME="${{ gitea.repository }}"
          REPO_NAME="${REPO_NAME##*/}"
          DEST="/root/projects/${REPO_NAME}"

          mkdir -p "${DEST}/apk"
          mkdir -p "${DEST}/web"

          # Copy APK
          # cp -f build/app/outputs/flutter-apk/app-release.apk "${DEST}/apk/app-release.apk"

          # Copy web build (overwrite contents)
          rm -rf "${DEST}/web"
          cp -r build/web "${DEST}/web"

          rm -rf /home/tbl.ng/public_html/app
          cp -r build/web /home/tbl.ng/public_html/app

          echo "Deployed to ${DEST}"

      - name: Verify deploy
        run: |
          # flutter_bootstrap.js changes every build, so its ETag is what the
          # running app polls to notice a new deploy. Fail loudly if the file
          # the app depends on is missing.
          for f in index.html flutter_bootstrap.js main.dart.wasm main.dart.js; do
            if [ ! -f "/home/tbl.ng/public_html/app/$f" ]; then
              echo "MISSING: $f"
              exit 1
            fi
          done
          echo "Deployed build:"
          cat /home/tbl.ng/public_html/app/version.json
